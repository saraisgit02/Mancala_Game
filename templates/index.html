<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Mancala - Jeu Africain Traditionnel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #FFA500;
            --green: #228B22;
            --red: #DC143C;
            --yellow: #FFD700;
            --turquoise: #20B2AA;
            --dark-green: #1B4D3E;
            --black: #1a0f0a;
            --cream: #FFF8DC;
        }

        body {
            font-family: 'Ubuntu', 'Arial', sans-serif;
            background: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* MOTIFS AFRICAINS EN ARRIÈRE-PLAN */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                /* Zigzag vert/orange */
                repeating-linear-gradient(45deg, transparent 0, transparent 20px, var(--green) 20px, var(--green) 25px, var(--orange) 25px, var(--orange) 30px, transparent 30px, transparent 50px),
                /* Triangles */
                repeating-linear-gradient(120deg, transparent 0, transparent 30px, var(--red) 30px, var(--red) 32px),
                /* Cercles */
                radial-gradient(circle at 20% 30%, var(--yellow) 2px, transparent 2px),
                radial-gradient(circle at 80% 70%, var(--turquoise) 2px, transparent 2px);
            background-size: 100px 100px, 150px 150px, 80px 80px, 80px 80px;
            opacity: 0.08;
            z-index: 0;
            animation: subtle-move 60s linear infinite;
        }

        @keyframes subtle-move {
            0% { background-position: 0 0, 0 0, 0 0, 0 0; }
            100% { background-position: 100px 100px, -150px -150px, 80px 80px, -80px -80px; }
        }

        .container {
            max-width: 1300px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ============= MENU PRINCIPAL ============= */
        .menu {
            text-align: center;
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--green) 100%);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            border: 8px solid var(--orange);
            position: relative;
            overflow: hidden;
        }

        /* Bordure décorative tribale */
        .menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: 
                repeating-linear-gradient(90deg, var(--orange) 0, var(--orange) 15px, var(--yellow) 15px, var(--yellow) 30px, var(--red) 30px, var(--red) 45px, var(--turquoise) 45px, var(--turquoise) 60px);
            z-index: 1;
        }

        .menu::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: 
                repeating-linear-gradient(90deg, var(--turquoise) 0, var(--turquoise) 15px, var(--red) 15px, var(--red) 30px, var(--yellow) 30px, var(--yellow) 45px, var(--orange) 45px, var(--orange) 60px);
            z-index: 1;
        }

        .menu h1 {
            font-size: 5em;
            color: var(--yellow);
            margin: 30px 0 20px;
            text-shadow: 4px 4px 0 var(--orange), 8px 8px 0 var(--red);
            font-weight: 900;
            letter-spacing: 8px;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
        }

        .menu p {
            font-size: 1.8em;
            color: var(--cream);
            margin-bottom: 50px;
            font-style: italic;
            font-weight: 600;
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .menu-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .menu-button {
            background: linear-gradient(135deg, var(--orange), var(--red));
            color: white;
            border: 6px solid var(--yellow);
            padding: 30px 60px;
            font-size: 1.8em;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.1) 10px,
                rgba(255, 255, 255, 0.1) 20px
            );
            animation: pattern-slide 3s linear infinite;
        }

        @keyframes pattern-slide {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .menu-button:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 20px 50px rgba(255, 165, 0, 0.6),
                inset 0 2px 10px rgba(255, 255, 255, 0.4);
            border-color: var(--turquoise);
        }

        /* ============= INTERFACE DE JEU ============= */
        .game-container {
            display: none;
        }

        .game-header {
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--dark-green), var(--green));
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            border: 6px solid var(--orange);
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 30px,
                rgba(255, 215, 0, 0.1) 30px,
                rgba(255, 215, 0, 0.1) 60px
            );
        }

        .game-header h2 {
            font-size: 3em;
            color: var(--yellow);
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 var(--orange), 6px 6px 0 var(--red);
            font-weight: 900;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .current-player {
            font-size: 1.8em;
            color: white;
            font-weight: 900;
            padding: 20px 50px;
            background: linear-gradient(135deg, var(--orange), var(--red));
            border-radius: 20px;
            display: inline-block;
            border: 4px solid var(--yellow);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ============= SCORES ============= */
        .scores {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            gap: 30px;
        }

        .score-box {
            background: linear-gradient(135deg, var(--dark-green), var(--turquoise));
            color: white;
            padding: 30px 50px;
            border-radius: 25px;
            flex: 1;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border: 6px solid var(--orange);
            position: relative;
            overflow: hidden;
        }

        .score-box::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            pointer-events: none;
        }

        .score-box h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: var(--yellow);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-box .score {
            font-size: 4em;
            font-weight: 900;
            color: var(--yellow);
            text-shadow: 4px 4px 0 var(--orange), 8px 8px 0 rgba(0, 0, 0, 0.3);
            animation: score-pulse 2s ease-in-out infinite;
        }

        @keyframes score-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ============= PLATEAU DE JEU ============= */
        .board {
            background: 
                /* Image pattern (décommentez pour utiliser votre image) */
                /* url('african-pattern.jpg') center/cover, */
                linear-gradient(145deg, var(--dark-green), #0d2318);
            padding: 60px;
            border-radius: 35px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 -15px 40px rgba(0, 0, 0, 0.5);
            border: 12px solid var(--orange);
            position: relative;
            overflow: hidden;
        }

        /* Motifs tribaux décoratifs sur le board */
        .board::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 30px;
            background: 
                repeating-linear-gradient(
                    90deg,
                    var(--orange) 0,
                    var(--orange) 10px,
                    var(--yellow) 10px,
                    var(--yellow) 15px,
                    var(--red) 15px,
                    var(--red) 20px,
                    var(--turquoise) 20px,
                    var(--turquoise) 25px,
                    transparent 25px,
                    transparent 35px
                );
            border-radius: 15px;
            z-index: 1;
        }

        .board::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 30px;
            background: 
                repeating-linear-gradient(
                    90deg,
                    var(--turquoise) 0,
                    var(--turquoise) 10px,
                    var(--red) 10px,
                    var(--red) 15px,
                    var(--yellow) 15px,
                    var(--yellow) 20px,
                    var(--orange) 20px,
                    var(--orange) 25px,
                    transparent 25px,
                    transparent 35px
                );
            border-radius: 15px;
            z-index: 1;
        }

        .board-inner {
            display: flex;
            gap: 50px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* ============= STORES (GRANDS PUITS) ============= */
        .store {
            width: 130px;
            height: 380px;
            background: linear-gradient(180deg, var(--orange) 0%, var(--red) 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5em;
            font-weight: 900;
            color: white;
            box-shadow: 
                inset 0 8px 20px rgba(0, 0, 0, 0.6),
                0 15px 30px rgba(0, 0, 0, 0.5);
            border: 8px solid var(--yellow);
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .store::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 15px;
            background: repeating-linear-gradient(
                90deg,
                var(--yellow),
                var(--yellow) 8px,
                transparent 8px,
                transparent 16px
            );
            border-radius: 8px;
        }

        .store::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 15px;
            background: repeating-linear-gradient(
                90deg,
                var(--yellow),
                var(--yellow) 8px,
                transparent 8px,
                transparent 16px
            );
            border-radius: 8px;
        }

        .pits-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .pits-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
        }

        /* ============= PUITS (PITS) ============= */
        .pit {
            width: 115px;
            height: 115px;
            background: radial-gradient(circle at 35% 35%, var(--orange), var(--red));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8em;
            font-weight: 900;
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                inset 0 5px 15px rgba(0, 0, 0, 0.5),
                0 8px 20px rgba(0, 0, 0, 0.4);
            border: 7px solid var(--yellow);
            position: relative;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
        }

        /* Motif décoratif sur les pits */
        .pit::before {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, var(--yellow), var(--orange));
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            opacity: 0.8;
        }

        .pit::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, var(--turquoise), var(--green));
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            opacity: 0.8;
        }

        .pit:hover {
            transform: scale(1.2) rotate(8deg);
            box-shadow: 
                0 0 40px var(--yellow),
                inset 0 5px 15px rgba(0, 0, 0, 0.5);
            border-color: var(--turquoise);
        }

        .pit.clickable {
            cursor: pointer;
            animation: african-pulse 2s infinite;
            border-color: var(--turquoise);
        }

        @keyframes african-pulse {
            0%, 100% { 
                box-shadow: 
                    inset 0 5px 15px rgba(0, 0, 0, 0.5),
                    0 8px 20px rgba(0, 0, 0, 0.4);
            }
            50% { 
                box-shadow: 
                    inset 0 5px 15px rgba(0, 0, 0, 0.5),
                    0 0 35px var(--yellow);
            }
        }

        .pit.selected {
            animation: tribal-bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 60px var(--yellow), 0 0 90px var(--orange);
            transform: scale(1.35) rotate(15deg);
            border-color: var(--turquoise);
        }

        @keyframes tribal-bounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.4) rotate(15deg); }
            50% { transform: scale(1.3) rotate(-10deg); }
            75% { transform: scale(1.4) rotate(10deg); }
        }

        .pit-label {
            position: absolute;
            top: -45px;
            font-size: 0.55em;
            color: var(--yellow);
            font-weight: 900;
            background: linear-gradient(135deg, var(--orange), var(--red));
            padding: 8px 18px;
            border-radius: 12px;
            border: 4px solid var(--yellow);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }

        .pit.bottom-row .pit-label {
            top: auto;
            bottom: -45px;
        }

        /* ============= CONTRÔLES ============= */
        .controls {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 22px 50px;
            font-size: 1.4em;
            font-weight: 900;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 5px solid transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--orange), var(--red));
            color: white;
            border-color: var(--yellow);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--turquoise), var(--green));
            color: white;
            border-color: var(--yellow);
        }

        .btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(255, 165, 0, 0.6);
            border-color: var(--turquoise);
        }

        /* ============= MODAL DE FIN ============= */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--dark-green), var(--green));
            padding: 70px;
            border-radius: 35px;
            text-align: center;
            color: white;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9);
            animation: modal-appear 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 10px solid var(--orange);
            max-width: 700px;
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: repeating-linear-gradient(
                90deg,
                var(--orange) 0,
                var(--orange) 20px,
                var(--yellow) 20px,
                var(--yellow) 40px,
                var(--red) 40px,
                var(--red) 60px
            );
        }

        .modal-content::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: repeating-linear-gradient(
                90deg,
                var(--red) 0,
                var(--red) 20px,
                var(--yellow) 20px,
                var(--yellow) 40px,
                var(--orange) 40px,
                var(--orange) 60px
            );
        }

        @keyframes modal-appear {
            from { 
                transform: scale(0.3) rotate(-20deg); 
                opacity: 0; 
            }
            to { 
                transform: scale(1) rotate(0deg); 
                opacity: 1; 
            }
        }

        .modal-content h2 {
            font-size: 4.5em;
            margin: 40px 0 30px;
            text-shadow: 5px 5px 0 var(--orange), 10px 10px 0 var(--red);
            color: var(--yellow);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            z-index: 1;
        }

        .modal-content p {
            font-size: 2.2em;
            margin-bottom: 40px;
            color: white;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        /* ============= LOADING ============= */
        .loading {
            text-align: center;
            color: white;
            font-size: 1.8em;
            margin-top: 30px;
            background: linear-gradient(135deg, var(--orange), var(--red));
            padding: 25px;
            border-radius: 20px;
            border: 5px solid var(--yellow);
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .spinner {
            border: 6px solid rgba(255, 215, 0, 0.3);
            border-top: 6px solid var(--yellow);
            border-right: 6px solid var(--orange);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: african-spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes african-spin {
            0% { 
                transform: rotate(0deg);
                border-top-color: var(--yellow);
            }
            33% {
                border-top-color: var(--orange);
            }
            66% {
                border-top-color: var(--red);
            }
            100% { 
                transform: rotate(360deg);
                border-top-color: var(--yellow);
            }
        }

        /* ============= MESSAGES D'ERREUR ============= */
        .error-message {
            background: linear-gradient(135deg, #8B0000, #DC143C);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            text-align: center;
            font-weight: 900;
            border: 5px solid var(--yellow);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hidden {
            display: none !important;
        }

        /* ============= RESPONSIVE ============= */
        @media (max-width: 1024px) {
            .board {
                padding: 40px;
            }
            
            .board-inner {
                gap: 30px;
            }
            
            .store {
                width: 100px;
                height: 300px;
                font-size: 3.5em;
            }
            
            .pit {
                width: 90px;
                height: 90px;
                font-size: 2.2em;
            }
        }

        @media (max-width: 768px) {
            .menu h1 {
                font-size: 3em;
            }
            
            .board {
                padding: 25px;
            }
            
            .board-inner {
                gap: 15px;
            }
            
            .store {
                width: 70px;
                height: 250px;
                font-size: 2.5em;
                border: 5px solid var(--yellow);
            }
            
            .pit {
                width: 65px;
                height: 65px;
                font-size: 1.6em;
                border: 4px solid var(--yellow);
            }
            
            .pits-row {
                gap: 12px;
            }

            .pit-label {
                top: -35px;
                font-size: 0.5em;
                padding: 5px 10px;
            }

            .pit.bottom-row .pit-label {
                bottom: -35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MENU PRINCIPAL -->
        <div id="menu" class="menu">
            <h1>🌍 MANCALA 🌍</h1>
            <p>✨ Jeu Traditionnel Africain ✨</p>
            <div id="error-container"></div>
            <div class="menu-buttons">
                <button class="menu-button" onclick="startGame('hvai')">
                    👤 Humain vs IA
                </button>
                <button class="menu-button" onclick="startGame('aivai')">
                    🤖 IA vs IA
                </button>
            </div>
        </div>

        <!-- INTERFACE DE JEU -->
        <div id="game" class="game-container">
            <div class="game-header">
                <h2 id="game-mode-title">🎮 Mancala 🎮</h2>
                <div id="current-player" class="current-player">Tour du Joueur 1</div>
            </div>

            <div class="scores">
                <div class="score-box">
                    <h3>🤖 Joueur 2 / IA 2</h3>
                    <div class="score" id="score-2">0</div>
                </div>
                <div class="score-box">
                    <h3>👤 Joueur 1 / IA 1</h3>
                    <div class="score" id="score-1">0</div>
                </div>
            </div>

            <div class="board">
                <div class="board-inner">
                    <div class="store" id="store-2">0</div>
                    
                    <div class="pits-area">
                        <div class="pits-row" id="row-2">
                            <!-- Pits L K J I H G -->
                        </div>
                        <div class="pits-row" id="row-1">
                            <!-- Pits A B C D E F -->
                        </div>
                    </div>
                    
                    <div class="store" id="store-1">0</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="backToMenu()">
                    🏠 Menu
                </button>
                <button class="btn btn-primary" onclick="resetGame()">
                    🔄 Rejouer
                </button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>⚡ L'IA Réfléchit... ⚡</p>
            </div>
        </div>
    </div>

    <!-- MODAL DE FIN -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">🎉 Fin de Partie! 🎉</h2>
            <p id="modal-message">Gagnant: Joueur 1</p>
            <button class="btn btn-primary" onclick="resetGame()">
                🔄 Rejouer
            </button>
            <button class="btn btn-secondary" onclick="backToMenu()">
                🏠 Menu
            </button>
        </div>
    </div>

    <script>
        let gameId = null;
        let gameMode = null;
        let isAnimating = false;
        const API_BASE = '/api';

        console.log('🌍 Interface africaine chargée avec succès!');

        function showError(message) {
            console.error('❌ Erreur:', message);
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = '⚠️ ' + message;
            
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = '';
            errorContainer.appendChild(errorDiv);
            
            setTimeout(() => errorDiv.remove(), 5000);
        }

        async function startGame(mode) {
            console.log('🎮 Démarrage du jeu en mode:', mode);
            gameMode = mode;
            
            try {
                const response = await axios.post(`${API_BASE}/new_game`, {
                    mode: mode,
                    depth: 6
                });

                gameId = response.data.game_id;
                console.log('✅ Partie créée avec ID:', gameId);
                
                document.getElementById('menu').style.display = 'none';
                document.getElementById('game').style.display = 'block';
                
                const title = mode === 'hvai' ? '👤 Humain vs 🤖 IA' : '🤖 IA 1 vs IA 2';
                document.getElementById('game-mode-title').textContent = title;
                
                updateBoard(response.data.board, response.data.current_player);
                
                if (mode === 'aivai') {
                    setTimeout(() => playAI(), 1000);
                }
            } catch (error) {
                console.error('❌ Erreur:', error);
                if (error.response) {
                    showError(`Erreur serveur: ${error.response.data.error || 'Erreur inconnue'}`);
                } else if (error.request) {
                    showError('Impossible de contacter le serveur. Vérifiez que Flask tourne sur le port 5000.');
                } else {
                    showError(`Erreur: ${error.message}`);
                }
            }
        }

        function updateBoard(board, currentPlayer) {
            document.getElementById('store-1').textContent = board['1'];
            document.getElementById('store-2').textContent = board['2'];
            document.getElementById('score-1').textContent = board['1'];
            document.getElementById('score-2').textContent = board['2'];

            const playerText = currentPlayer === 'player1' 
                ? (gameMode === 'hvai' ? '🎮 Votre Tour' : '🤖 IA 1')
                : '🤖 IA 2';
            document.getElementById('current-player').textContent = playerText;

            const row2 = document.getElementById('row-2');
            row2.innerHTML = '';
            ['L', 'K', 'J', 'I', 'H', 'G'].forEach(pit => {
                const pitDiv = createPitElement(pit, board[pit], false);
                row2.appendChild(pitDiv);
            });

            const row1 = document.getElementById('row-1');
            row1.innerHTML = '';
            ['A', 'B', 'C', 'D', 'E', 'F'].forEach(pit => {
                const clickable = gameMode === 'hvai' && currentPlayer === 'player1' && board[pit] > 0;
                const pitDiv = createPitElement(pit, board[pit], clickable);
                if (clickable) {
                    pitDiv.onclick = () => humanMove(pit);
                }
                row1.appendChild(pitDiv);
            });
        }

        function createPitElement(label, count, clickable) {
            const div = document.createElement('div');
            div.className = 'pit';
            if (clickable) div.classList.add('clickable');
            if (label >= 'A' && label <= 'F') div.classList.add('bottom-row');
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'pit-label';
            labelDiv.textContent = label;
            
            div.appendChild(labelDiv);
            div.appendChild(document.createTextNode(count));
            
            return div;
        }

        async function humanMove(pit) {
            if (isAnimating) return;
            
            isAnimating = true;
            const pitElement = event.target;
            pitElement.classList.add('selected');

            try {
                const response = await axios.post(`${API_BASE}/human_move/${gameId}`, {
                    pit: pit
                });

                setTimeout(() => {
                    pitElement.classList.remove('selected');
                    updateBoard(response.data.board, response.data.current_player);
                    
                    if (response.data.game_over) {
                        showEndModal(response.data.winner);
                    } else if (gameMode === 'hvai') {
                        setTimeout(() => playAI(), 800);
                    }
                    
                    isAnimating = false;
                }, 600);
            } catch (error) {
                console.error('❌ Erreur:', error);
                showError(error.response?.data?.error || 'Erreur lors du coup');
                isAnimating = false;
                pitElement.classList.remove('selected');
            }
        }

        async function playAI() {
            if (isAnimating) return;
            
            isAnimating = true;
            document.getElementById('loading').classList.remove('hidden');

            try {
                const state = await axios.get(`${API_BASE}/get_state/${gameId}`);
                const currentPlayer = state.data.current_player;
                const heuristic = (gameMode === 'aivai' && currentPlayer === 'player2') 
                    ? 'aggressive' : 'balanced';

                console.log(`🤖 IA joue avec heuristique: ${heuristic}`);

                const response = await axios.post(`${API_BASE}/ai_move/${gameId}`, {
                    heuristic: heuristic
                });

                document.getElementById('loading').classList.add('hidden');

                const bestPit = response.data.best_pit;
                console.log(`✅ IA choisit le pit: ${bestPit}`);

                const pitElements = document.querySelectorAll('.pit');
                pitElements.forEach(pit => {
                    if (pit.textContent.includes(bestPit)) {
                        pit.classList.add('selected');
                        setTimeout(() => pit.classList.remove('selected'), 600);
                    }
                });

                setTimeout(() => {
                    updateBoard(response.data.board, response.data.current_player);
                    
                    if (response.data.game_over) {
                        showEndModal(response.data.winner);
                    } else if (gameMode === 'aivai') {
                        setTimeout(() => playAI(), 1000);
                    }
                    
                    isAnimating = false;
                }, 600);
            } catch (error) {
                console.error('❌ Erreur:', error);
                document.getElementById('loading').classList.add('hidden');
                showError(error.response?.data?.error || 'Erreur lors du coup de l\'IA');
                isAnimating = false;
            }
        }

        function showEndModal(winner) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');

            if (winner.winner === 'draw') {
                title.textContent = '🤝 Match Nul! 🤝';
                message.textContent = `Score Final: ${winner.score1} - ${winner.score2}`;
            } else {
                const winnerName = winner.winner === 'player1' 
                    ? (gameMode === 'hvai' ? '🎉 Vous avez gagné!' : '🤖 IA 1 Gagne!')
                    : '🤖 IA 2 Gagne!';
                title.textContent = '🏆 Victoire! 🏆';
                message.textContent = `${winnerName} | Score: ${winner.score1} - ${winner.score2}`;
            }

            modal.style.display = 'flex';
        }

        function backToMenu() {
            if (gameId) {
                axios.delete(`${API_BASE}/delete_game/${gameId}`).catch(e => console.error(e));
            }
            
            document.getElementById('game').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('modal').style.display = 'none';
            document.getElementById('error-container').innerHTML = '';
            gameId = null;
            gameMode = null;
        }

        function resetGame() {
            if (gameId) {
                axios.delete(`${API_BASE}/delete_game/${gameId}`).catch(e => console.error(e));
            }
            
            document.getElementById('modal').style.display = 'none';
            startGame(gameMode);
        }

        console.log('✅ Toutes les fonctions JavaScript chargées');
        console.log('🔌 API_BASE:', API_BASE);
    </script>
</body>
</html>
